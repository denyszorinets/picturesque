[package]
name = "decoding-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway benchmark for ADR-0005 (issue #10). Not part of the workspace."

[workspace]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
libvips = "=2.3.0"
rawler = "=0.8.0"
libheif-rs = "=3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
debug = false
