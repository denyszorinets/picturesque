# Builds installers and drafts a GitHub release (docs/development/releasing.rst).
#
# - Push a tag vX.Y.Z on main: builds every installer and creates a draft
#   release with them and their checksums; a maintainer reviews and
#   publishes it.
# - Push to a release/* branch, open a pull request that changes packaging,
#   or run it manually (workflow_dispatch): a dry run that builds the
#   installers and keeps them as workflow artifacts, without a release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: ["release/**"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri*.conf.json
      - scripts/critic-libs.sh
      - scripts/bundle-macos.sh
      - scripts/setup-windows-libvips.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: Version from the tag (or the sources on a dry run)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            python3 scripts/set-version.py --check "$version"
          else
            version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: deb and AppImage (Ubuntu 24.04)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            libvips-dev libraw-dev libheif-dev libheif-plugin-libde265 \
            glslc libvulkan-dev spirv-headers

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ONNX Runtime library
        run: scripts/ort-dylib.sh release

      - name: Critic helper with llama.cpp
        run: scripts/critic-libs.sh release

      - name: Build deb and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles deb,appimage

      - name: The deb ships the critic helper with its libraries
        run: |
          contents=$(dpkg-deb -c target/release/bundle/deb/*.deb)
          for f in picturesque-critic libllama.so.0 libmtmd.so.0 libggml-vulkan.so libggml-cpu-x64.so; do
            grep -q "usr/lib/picturesque/critic/$f" <<<"$contents" || { echo "missing $f" >&2; exit 1; }
          done

      - name: No load-time ONNX Runtime or Dawn
        # Loaded at first use, after a processor check (ADR-0015): linked at
        # load time, they would end the app on older CPUs (#154).
        run: |
          if readelf -d target/release/picturesque-desktop | grep -E 'onnxruntime|webgpu_dawn'; then
            echo "picturesque-desktop must not link ONNX Runtime or Dawn" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-ubuntu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  fedora:
    name: rpm (Fedora 44)
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc gcc-c++ make rpm-build nodejs npm \
            webkit2gtk4.1-devel gtk3-devel libsoup3-devel librsvg2-devel libayatana-appindicator-gtk3-devel \
            openssl-devel \
            vips-devel LibRaw-devel libheif-devel \
            cmake clang-devel patchelf glslc vulkan-headers vulkan-loader-devel spirv-headers-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - name: ONNX Runtime library
        run: scripts/ort-dylib.sh release

      - name: Critic helper with llama.cpp
        run: scripts/critic-libs.sh release

      - name: Build rpm
        run: npx tauri build --bundles rpm

      - name: No load-time ONNX Runtime or Dawn
        # Loaded at first use, after a processor check (ADR-0015): linked at
        # load time, they would end the app on older CPUs (#154).
        run: |
          if readelf -d target/release/picturesque-desktop | grep -E 'onnxruntime|webgpu_dawn'; then
            echo "picturesque-desktop must not link ONNX Runtime or Dawn" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-fedora
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    name: dmg (macOS 15)
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install image libraries
        run: |
          brew install vips libraw libheif dylibbundler
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Critic helper with llama.cpp
        run: scripts/critic-libs.sh release

      - name: Build the app bundle
        run: npx tauri build --bundles app

      - name: Bundle Homebrew libraries into the app and make the dmg
        run: scripts/bundle-macos.sh

      - name: Start the app from the dmg
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/picturesque-dmg
          cp -R /tmp/picturesque-dmg/Picturesque.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/picturesque-dmg
          # The app opens its catalog once dyld loaded every library (a
          # missing or rejected one stops it at launch, #52).
          "$RUNNER_TEMP/Picturesque.app/Contents/MacOS/picturesque-desktop" &
          catalog="$HOME/Library/Application Support/io.github.denyszorinets.picturesque/catalog.sqlite"
          for _ in $(seq 1 30); do [ -f "$catalog" ] && break; sleep 2; done
          kill %1 || true
          test -f "$catalog"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: msi and exe (Windows Server 2025)
    needs: version
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up libvips (with LibRaw and libheif)
        run: scripts/setup-windows-libvips.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Critic helper with llama.cpp
        run: scripts/critic-libs.sh release

      - name: Build the installers
        # The critic folder (scripts/critic-libs.sh) is added only here: Tauri
        # checks resources when the app compiles, and tests do not build it.
        run: npx tauri build --bundles nsis,msi --config src-tauri/tauri.critic.windows.conf.json

      - name: Install silently and start the app
        run: |
          ls target/release/*.dll || true
          installer=$(ls target/release/bundle/nsis/*.exe)
          "$installer" //S
          dir="$LOCALAPPDATA/Picturesque"
          ls "$dir"
          # The app opens its catalog once its libraries loaded (a missing
          # DLL stops it before, behind an error dialog).
          "$dir/picturesque-desktop.exe" &
          catalog="$APPDATA/io.github.denyszorinets.picturesque/catalog.sqlite"
          for _ in $(seq 1 30); do [ -f "$catalog" ] && break; sleep 2; done
          taskkill //F //IM picturesque-desktop.exe || true
          test -f "$catalog"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    needs: [version, ubuntu, fedora, macos, windows]
    if: always() && github.ref_type == 'tag' && needs.ubuntu.result == 'success' && needs.fedora.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Checksums
        # Artifacts keep their bundle folders (deb/, nsis/, ...): flatten them.
        run: |
          mkdir release
          find installers -type f -exec mv -t release {} +
          cd release && sha256sum -- * > SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --draft --verify-tag --generate-notes \
            --title "Picturesque ${TAG#v}"
