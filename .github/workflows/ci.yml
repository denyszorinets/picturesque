name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FLAGS: --locked

jobs:
  linux:
    name: Linux (check, bindings, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Tauri, libvips, LibRaw, libheif + HEVC)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf \
            libvips-dev libraw-dev libheif-dev libheif-plugin-libde265

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Prebuilt ONNX Runtime downloaded by `ort` at build time.
          cache-directories: ~/.cache/ort.pyke.io

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: make check
        run: make check

      - name: Generated TypeScript bindings are up to date
        run: make bindings-check

      - name: Install Playwright Chromium
        run: npm exec -w ui -- playwright install --with-deps chromium

      - name: End-to-end tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  app-smoke:
    name: Desktop app smoke test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Tauri, image libraries, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf \
            libvips-dev libraw-dev libheif-dev libheif-plugin-libde265 \
            webkit2gtk-driver xvfb

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Smoke test (build, launch, import fixtures, pick a photo)
        run: make smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-smoke-screenshots
          path: target/smoke-results/
          retention-days: 7

  platforms:
    name: ${{ matrix.name }} (build, test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Prebuilt ONNX Runtime downloaded by `ort` at build time.
          cache-directories: ~/.cache/ort.pyke.io

      - name: Install image libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vips libraw libheif
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install image libraries (Windows)
        if: runner.os == 'Windows'
        run: scripts/setup-windows-libvips.sh

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: |
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: make docs-check
        run: make docs-check
