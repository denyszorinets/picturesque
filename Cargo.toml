[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/denyszorinets/picturesque"
publish = false

[workspace.dependencies]
picturesque-core = { path = "crates/core" }
picturesque-app = { path = "crates/app" }
picturesque-infra = { path = "crates/infra" }
picturesque-devserver = { path = "crates/devserver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
tempfile = "3.27.0"
kamadak-exif = "0.6.1"
rawler = "0.8.0"
imagesize = "0.15.0"
flate2 = "1"
blake3 = "1.8.7"
libvips = "2.3.0"
quick-xml = "0.42.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
ts-rs = "12.0.1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
futures-util = { version = "0.3.34", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
fs4 = "1.1.0"
notify = "8.2.0"
# ONNX Runtime, statically linked from prebuilt binaries downloaded at build
# time; execution-provider features are chosen per target in infra.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Native and hashing code is slow unoptimized; keep debug builds and tests
# representative.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.rawler]
opt-level = 3
