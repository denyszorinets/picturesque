[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/denyszorinets/picturesque"
publish = false

[workspace.dependencies]
picturesque-core = { path = "crates/core" }
picturesque-app = { path = "crates/app" }
picturesque-infra = { path = "crates/infra" }
picturesque-devserver = { path = "crates/devserver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
ts-rs = "12.0.1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
