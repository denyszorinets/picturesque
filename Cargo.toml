[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/denyszorinets/picturesque"
publish = false

[workspace.dependencies]
picturesque-core = { path = "crates/core" }
picturesque-app = { path = "crates/app" }
picturesque-infra = { path = "crates/infra" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
